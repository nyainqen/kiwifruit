<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联系购买 · 周至金果 Zhikiwi</title>
<meta name="description" content="扫码加微信，直接产地价购买周至翠香猕猴桃。坏果包赔，售后无忧。">
<link rel="stylesheet" href="/style.css">
<style>
  .contact-wrap { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1.2fr; gap: 40px; align-items: start; }
  .contact-card { background: #fff; border-radius: 20px; padding: 36px; box-shadow: 0 8px 28px rgba(0,0,0,0.08); text-align: center; }
  .contact-card h3 { font-size: 20px; color: #3a5c32; margin-bottom: 20px; }
  .contact-card .qr { width: 200px; height: 200px; margin: 0 auto 18px; background: #fff; border-radius: 16px; padding: 10px; border: 1px solid #e8f0e4; }
  .contact-card .wechat-id { font-size: 17px; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
  .contact-card .note { font-size: 14px; color: var(--text-light); }
  .faq h3 { font-size: 20px; color: #3a5c32; margin-bottom: 20px; }
  .faq-item { background: #fff; border-radius: 14px; padding: 20px 24px; margin-bottom: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.05); }
  .faq-item h4 { font-size: 15px; color: #3a5c32; margin-bottom: 6px; }
  .faq-item p { font-size: 14px; color: var(--text-mid); }
  @media (max-width: 768px) { .contact-wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="site-nav"></div>

<header class="page-header">
  <h1>联系购买</h1>
  <p>扫码加微信，直接产地价</p>
</header>

<section>
  <div class="contact-wrap">
    <div class="contact-card">
      <h3>加微信下单</h3>
      <div class="qr">
        <!-- 请确保上传了微信二维码到 images/wechat/wechat-qr.png -->
        <img src="/images/wechat/wechat-qr.png" alt="微信二维码">
      </div>
      <div class="wechat-id">微信号：XXXXXXX</div>
      <div class="note">服务时间：9:00 - 21:00</div>
    </div>
    <div class="faq">
      <h3>常见问题</h3>
      <div class="faq-item"><h4>Q：怎么下单？</h4><p>A：扫码加微信，直接沟通下单，微信下单享产地直供价。</p></div>
      <div class="faq-item"><h4>Q：多久发货？</h4><p>A：下单后48小时内发货，顺丰/京东。</p></div>
      <div class="faq-item"><h4>Q：翠香什么时候有货？</h4><p>A：翠香猕猴桃采收期为每年9月上中旬，应季发货。</p></div>
      <div class="faq-item"><h4>Q：坏果怎么办？</h4><p>A：拍照发给微信客服，按枚赔付，不用退货。</p></div>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<div id="site-mobile-nav"></div>

<script src="/common.js"></script>
</body>
</html>
