<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品中心 · 周至金果 Zhikiwi</title>
<meta name="description" content="周至金果 Zhikiwi 当季鲜果，翠香猕猴桃普通装、礼盒装等，产地直供，坏果包赔。">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- 导航栏自动注入 -->
<div id="site-nav"></div>

<!-- 页面头部 -->
<header class="page-header">
  <h1>当季鲜果</h1>
  <p>周至金果 · 产地直供</p>
</header>

<!-- 产品列表区域 -->
<section>
  <div id="product-list" class="product-grid"></div>
</section>

<!-- 页脚和手机导航 -->
<div id="site-footer"></div>
<div id="site-mobile-nav"></div>

<!-- 引入数据脚本 -->
<script src="/products-data.js"></script>
<script>
  const container = document.getElementById("product-list");
  if (container && typeof PRODUCTS !== "undefined") {
    // 直接遍历所有产品，生成卡片
    container.innerHTML = PRODUCTS.map(p => `
      <div class="product-card">
        <div class="product-img-wrap">
          <img src="${p.image}" alt="${p.name}">
          ${p.badge ? `<div class="product-badge">${p.badge}</div>` : ""}
        </div>
        <div class="product-info">
          <h3>${p.name}</h3>
          <p class="desc">${p.desc}</p>
          <div class="price-row">
            <span class="price">${p.price}</span>
            <span class="unit">${p.unit}</span>
          </div>
          <a href="${p.detailUrl}" class="btn-outline">查看详情</a>
        </div>
      </div>
    `).join("");
  }
</script>
<script src="/common.js"></script>
</body>
</html>
