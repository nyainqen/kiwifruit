<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关于我们 · 周至金果 Zhikiwi</title>
<meta name="description" content="扎根周至的翠香猕猴桃产地直供者，只做当季鲜果，产地直发，坏果包赔。">
<link rel="stylesheet" href="/style.css">
<style>
  .about-wrap { max-width: 800px; margin: 0 auto; }
  .about-wrap h3 { font-size: 24px; color: #3a5c32; margin-bottom: 16px; }
  .about-wrap p { font-size: 15px; color: var(--text-mid); margin-bottom: 16px; line-height: 1.8; }
  .values { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; max-width: 900px; margin: 0 auto; }
  .value-item { background: #fff; border-radius: 18px; padding: 36px 24px; text-align: center; box-shadow: 0 6px 24px rgba(74,124,63,0.08); }
  .value-item .icon { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #eaf3e5, #d4e8cb); display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 18px; }
  .value-item h3 { font-size: 18px; color: #3a5c32; margin-bottom: 8px; }
  .value-item p { font-size: 14px; color: var(--text-light); }
  @media (max-width: 768px) { .values { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="site-nav"></div>

<header class="page-header">
  <h1>关于我们</h1>
  <p>扎根周至的翠香猕猴桃产地直供者</p>
</header>

<section>
  <div class="about-wrap">
    <h3>我们的故事</h3>
    <p>周至金果（Zhikiwi）扎根于陕西周至——中国猕猴桃之乡，全球最大的猕猴桃生产基地。周至猕猴桃种植面积达43.2万亩，年产鲜果59万吨。</p>
    <p>我们只做一件事：把周至核心产区的优质翠香猕猴桃，以最直接的方式送到消费者手中。</p>
  </div>
</section>

<section style="background:var(--primary-bg);">
  <h2 class="section-title">三大坚持</h2>
  <div class="values">
    <div class="value-item">
      <div class="icon">🌿</div>
      <h3>只做当季鲜果</h3>
      <p>翠香采收期集中在9月上中旬，只在这个时段采摘发货，不做反季果。</p>
    </div>
    <div class="value-item">
      <div class="icon">📦</div>
      <h3>产地直发</h3>
      <p>果园直采直发，没有中间商，新鲜度和价格都有保障。</p>
    </div>
    <div class="value-item">
      <div class="icon">🤝</div>
      <h3>坏果包赔</h3>
      <p>售后无忧，坏果拍照即赔，不让消费者承担风险。</p>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<div id="site-mobile-nav"></div>

<script src="/common.js"></script>
</body>
</html>
