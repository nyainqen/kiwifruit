<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周至金果 Zhikiwi · 陕西周至翠香猕猴桃产地直供</title>
<meta name="description" content="周至金果 Zhikiwi，源自陕西周至秦岭北麓。绿心翠香、红心红阳，树上八九分熟采摘，产地直供，坏果包赔。">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- 导航栏（由 common.js 自动注入） -->
<div id="site-nav"></div>

<!-- 1. 首屏 Banner -->
<header class="hero">
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <div class="hero-eyebrow">陕西 · 周至 · 秦岭北麓</div>
    <h1>周至金果 · 翠香系列</h1>
    <p>道地好果，树上八九分熟采摘。绿心翠香，细嫩多汁。</p>
    <div class="hero-buttons">
      <a href="/pages/products.html" class="btn-main">查看当季鲜果</a>
      <a href="/pages/contact.html" class="btn-ghost">扫码加微信</a>
    </div>
  </div>
</header>

<!-- 2. 三大信任背书 -->
<section>
  <div class="trust-grid">
    <div class="trust-item">
      <div class="trust-icon">🌿</div>
      <h3>秦岭北麓核心产区</h3>
      <p>世界猕猴桃原生地之一，日照超2000小时</p>
    </div>
    <div class="trust-item">
      <div class="trust-icon">☀️</div>
      <h3>树上八九分熟采摘</h3>
      <p>不催熟，后熟糖度可达15°以上</p>
    </div>
    <div class="trust-item">
      <div class="trust-icon">📦</div>
      <h3>坏果包赔</h3>
      <p>拍照即赔，售后无忧</p>
    </div>
  </div>
</section>

<!-- 3. 当季主打（由 JS 自动读取产品数据渲染） -->
<section style="background:var(--primary-bg);">
  <h2 class="section-title">当季主打</h2>
  <p class="section-sub">周至金果，产地直供</p>
  
  <!-- 产品卡片渲染容器 -->
  <div id="home-product-list" class="product-grid"></div>
  
  <div style="text-align:center; margin-top:40px;">
    <a href="/pages/products.html" class="btn-outline" style="font-size:15px; padding:12px 30px;">查看全部产品 →</a>
  </div>
</section>

<!-- 4. 品牌与产地介绍引导 -->
<section style="background:#fff;">
  <div style="max-width:1000px; margin:0 auto; text-align:center;">
    <h2 class="section-title">来自秦岭北麓的馈赠</h2>
    <p class="section-sub">扎根中国猕猴桃之乡</p>
    <p style="color:var(--text-mid); font-size:15px; max-width:800px; margin:0 auto 30px; line-height:1.8;">
      周至金果（Zhikiwi）扎根陕西周至。我们坚持只做当季鲜果，从标准化采摘到冷链发货，致力于将秦岭北麓核心产区的优质绿心与红心猕猴桃，以最直接的方式送到您的手中。
    </p>
    <div style="display:flex; gap:16px; justify-content:center; flex-wrap:wrap;">
      <a href="/pages/story.html" class="btn-outline">了解产地故事</a>
      <a href="/pages/contact.html" class="btn-main" style="padding:10px 26px; font-size:14px; border-radius:22px;">联系我们</a>
    </div>
  </div>
</section>

<!-- 页脚和手机底部导航（自动注入） -->
<div id="site-footer"></div>
<div id="site-mobile-nav"></div>

<!-- 引入产品数据和渲染脚本 -->
<script src="/products-data.js"></script>
<script>
  // 渲染首页的 2 个主打产品卡片
  const homeContainer = document.getElementById("home-product-list");
  if (homeContainer && typeof PRODUCTS !== "undefined") {
    homeContainer.innerHTML = PRODUCTS.slice(0, 2).map(p => `
      <div class="product-card">
        <div class="product-img-wrap">
          <img src="${p.image}" alt="${p.name}">
          ${p.badge ? `<div class="product-badge">${p.badge}</div>` : ""}
        </div>
        <div class="product-info">
          <h3>${p.name}</h3>
          <p class="desc">${p.desc}</p>
          <div class="price-row">
            <span class="price">${p.price}</span>
            <span class="unit">${p.unit}</span>
          </div>
          <a href="${p.detailUrl}" class="btn-outline">查看详情</a>
        </div>
      </div>
    `).join("");
  }
</script>
<script src="/common.js"></script>

</body>
</html>
